<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごいた オンライン対戦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.1/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;
    --border:#d0d0d0;--border2:#e0e0e0;
    --text:#1a1a1a;--text2:#555;--text3:#888;
    --danger:#d94040;--info:#2b7fd4;--success:#2a9d5c;--warning:#d47d00;
    --radius:8px;--radius-lg:12px;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
      --border:#3a3a3a;--border2:#333;
      --text:#f0f0f0;--text2:#aaa;--text3:#666;
      --danger:#e06060;--info:#5b9fd4;--success:#4abf7c;--warning:#e09020;
    }
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  #app{width:100%;max-width:480px;padding:12px;}
  button{font-family:inherit;cursor:pointer;border-radius:var(--radius);border:none;padding:10px 20px;font-size:14px;font-weight:500;background:var(--text);color:var(--bg);transition:opacity .15s;}
  button:hover{opacity:.85}
  button.secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border);}
  button.danger{background:var(--danger);color:#fff;}
  input{font-family:inherit;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:14px;outline:none;width:100%;}
  input:focus{border-color:var(--info);}

  /* ===== NET OVERLAY ===== */
  #net-ov{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;overflow-y:auto;}
  .nt{font-family:'Noto Serif JP',serif;font-size:32px;font-weight:500;color:var(--text);}
  .ns{font-size:13px;color:var(--text2);text-align:center;line-height:1.6;}
  .nc{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
  .ninput{padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:22px;text-align:center;letter-spacing:8px;font-family:monospace;font-weight:700;width:100%;outline:none;}
  .ninput::placeholder{letter-spacing:1px;font-size:13px;font-family:sans-serif;font-weight:400;}
  .ncode{font-size:44px;font-weight:700;letter-spacing:10px;color:var(--text);font-family:monospace;background:var(--bg2);padding:14px 28px;border-radius:var(--radius);border:1px solid var(--border);}
  .slot{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border2);}
  .slot-num{font-size:12px;color:var(--text3);width:26px;flex-shrink:0;}
  .slot-name{font-size:14px;color:var(--text);flex:1;}
  .slot-tag{font-size:11px;padding:2px 8px;border-radius:999px;}
  .tag-you{background:#d4f0e2;color:#1a7a45;}
  .tag-conn{background:#d0e8f8;color:#1a5a8a;}
  .tag-cpu{background:var(--bg3);color:var(--text3);}
  .tag-wait{background:#fff3d0;color:#7a5000;}
  @media(prefers-color-scheme:dark){
    .tag-you{background:#1a3d2a;color:#4abf7c;}
    .tag-conn{background:#1a2d3d;color:#5b9fd4;}
    .tag-wait{background:#3d2a00;color:#d47d00;}
  }
  .divider{display:flex;align-items:center;gap:10px;width:100%;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2);}
  .divider span{font-size:11px;color:var(--text3);}
  #pstatus{font-size:12px;color:var(--text2);min-height:18px;text-align:center;}

  /* ===== GAME ===== */
  #gw{display:none;padding:10px 0 20px;}
  .gt polygon.gb{fill:var(--bg);stroke:var(--border);stroke-width:0.8;transition:fill .15s,stroke .15s}
  .gt text.gk{fill:var(--text);font-family:'Noto Serif JP',serif;font-weight:900}
  .gt.cl{cursor:pointer;transition:transform .15s}.gt.cl:hover{transform:translateY(-5px)}
  .gt.cl:hover polygon.gb{fill:var(--bg2);stroke:var(--border2)}
  .gt.hl polygon.gb{fill:#d4f0e2;stroke:var(--success);stroke-width:1.4}
  .gt.atk polygon.gb{fill:#fff3d0;stroke:var(--warning);stroke-width:1.2}
  .gt.fd polygon.gb{fill:var(--bg3);stroke:var(--border2)}
  .gt.dimmed polygon.gb{fill:var(--bg3);stroke:var(--border2);opacity:.35}
  .gt.dimmed{cursor:not-allowed}
  @media(prefers-color-scheme:dark){
    .gt.hl polygon.gb{fill:#1a3d2a;}
    .gt.atk polygon.gb{fill:#3d2a00;}
  }
  @keyframes gland{from{opacity:0;transform:scale(.5) translateY(-14px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .gt.landed{animation:gland .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes gshow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes gpulse{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes gp{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes nashirq{0%,100%{opacity:1}50%{opacity:.65}}
  .gind{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--border);vertical-align:middle;margin-left:3px}
  .gind.on{background:var(--warning);animation:gp 1.1s infinite}
  #cb{width:200px;height:200px;flex-shrink:0;border-radius:var(--radius);border:1px solid var(--border);}
  .nashi-req{background:#fff3d0!important;border-color:var(--warning)!important;color:var(--warning)!important;font-weight:700!important;animation:nashirq 1s infinite}
  @media(prefers-color-scheme:dark){.nashi-req{background:#3d2a00!important;}}
  .board-wrap{position:relative;border:1px solid var(--border2);border-radius:var(--radius-lg);background:var(--bg2);}
  .board-inner{padding:10px 10px 0;}
  .log-bar{border-top:1px solid var(--border2);padding:7px 14px;background:var(--bg2);border-radius:0 0 var(--radius-lg) var(--radius-lg);}
  .ov-base{display:none;position:absolute;inset:0;background:var(--bg);z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;border-radius:var(--radius-lg);}
  #ty-ov{z-index:15;}
  .score-box{text-align:center;border:1px solid var(--border2);border-radius:var(--radius);padding:8px 16px;background:var(--bg2);}
  .score-val{font-size:28px;font-weight:500;font-family:'Noto Serif JP',serif;color:var(--text);line-height:1.1;}
  .hand-row{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;}
  .side-box{border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);padding:7px 4px;text-align:center;width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .side-cnt{font-size:22px;font-weight:500;font-family:'Noto Serif JP',serif;color:var(--text);line-height:1.1;}
  .info-panel{margin-top:10px;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;}
  .info-head{padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border2);font-size:13px;font-weight:500;}
  .info-body{padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.8;}
</style>
</head>
<body>
<div id="app">

<!-- ======== NETWORK OVERLAY ======== -->
<div id="net-ov">
  <div id="sv" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px;">
    <div class="nt">ごいた</div>
    <div class="ns">能登半島の伝統遊戯<br>2対2チーム戦 オンライン対戦</div>
    <div class="nc" style="margin-top:8px;">
      <button onclick="NET_create()" style="font-size:15px;padding:14px;">🎮 ルームを作る（ホスト）</button>
      <div class="divider"><span>または</span></div>
      <input id="codeIn" class="ninput" placeholder="ルームコードを入力" maxlength="5"
        oninput="this.value=this.value.toUpperCase().replace(/[^A-Z]/g,'')">
      <button onclick="NET_join()" style="font-size:15px;padding:14px;">🔗 コードで参加</button>
      <div class="divider"><span>または</span></div>
      <button onclick="NET_solo()" class="secondary" style="font-size:14px;">👤 ひとりで遊ぶ（CPU対戦）</button>
    </div>
    <div id="pstatus"></div>
  </div>
  <div id="lv" style="display:none;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px;">
    <div style="font-size:15px;color:var(--text2);">ルームコード</div>
    <div id="codeDisp" class="ncode"></div>
    <div class="ns" id="lv-hint"></div>
    <div id="slots" style="width:100%;display:flex;flex-direction:column;gap:6px;"></div>
    <div id="lobbyMsg" style="font-size:13px;color:var(--text2);text-align:center;min-height:18px;"></div>
    <div id="startWrap" style="display:none;flex-direction:column;align-items:center;gap:6px;">
      <button id="startBtn" onclick="NET_hostStart()" style="font-size:15px;padding:12px 36px;">ゲーム開始！</button>
      <div style="font-size:11px;color:var(--text3);">2〜4人で開始できます。空き席はCPUが担当します。</div>
    </div>
    <button onclick="NET_back()" class="secondary" style="font-size:12px;margin-top:4px;">← 戻る</button>
  </div>
</div>

<!-- ======== GAME AREA ======== -->
<div id="gw">
  <div style="text-align:center;margin-bottom:10px;">
    <div style="font-family:'Noto Serif JP',serif;font-size:20px;font-weight:500;color:var(--text);">ごいた</div>
    <div id="room-badge" style="font-size:11px;color:var(--text3);margin-top:2px;"></div>
  </div>
  <div style="display:flex;justify-content:center;gap:14px;margin-bottom:10px;align-items:stretch;">
    <div class="score-box">
      <div style="font-size:10px;font-weight:500;color:var(--danger);">紅組</div>
      <div id="sc-a" class="score-val">0</div>
      <div style="font-size:10px;color:var(--text2);">点</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <div style="font-size:11px;color:var(--text3);">目標</div>
      <div style="font-size:15px;color:var(--text2);font-weight:500;">150点</div>
    </div>
    <div class="score-box">
      <div style="font-size:10px;font-weight:500;color:var(--info);">白組</div>
      <div id="sc-b" class="score-val">0</div>
      <div style="font-size:10px;color:var(--text2);">点</div>
    </div>
  </div>

  <div class="board-wrap" style="min-height:540px;">
    <div id="ov" class="ov-base">
      <div id="ov-msg" style="font-size:17px;font-weight:500;font-family:'Noto Serif JP',serif;color:var(--text);line-height:1.9;"></div>
      <div id="ov-acts"></div>
    </div>
    <div id="ty-ov" class="ov-base">
      <div id="ty-badge" style="font-size:22px;font-weight:500;font-family:'Noto Serif JP',serif;color:var(--text);"></div>
      <div id="ty-player" style="font-size:12px;color:var(--text2);"></div>
      <div id="ty-tiles" style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:4px 0;"></div>
      <div id="ty-msg" style="font-size:13px;color:var(--text2);line-height:1.7;max-width:300px;"></div>
      <div id="ty-acts" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;"></div>
    </div>
    <div class="board-inner">
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:8px;">
        <div id="lbl-top" style="font-size:11px;font-weight:500;color:var(--danger);margin-bottom:4px;">
          上家（味方） <span class="gind" id="ind-top"></span>
        </div>
        <div id="h-top" class="hand-row"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px;">
        <div class="side-box">
          <div id="lbl-left" style="font-size:11px;font-weight:500;color:var(--info);">左家 <span class="gind" id="ind-left"></span></div>
          <div id="cnt-left" class="side-cnt">8</div>
          <div style="font-size:11px;color:var(--text2);">枚</div>
        </div>
        <div id="cb"></div>
        <div class="side-box">
          <div id="lbl-right" style="font-size:11px;font-weight:500;color:var(--info);">右家 <span class="gind" id="ind-right"></span></div>
          <div id="cnt-right" class="side-cnt">8</div>
          <div style="font-size:11px;color:var(--text2);">枚</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;padding-bottom:10px;">
        <div id="lbl-bottom" style="font-size:11px;font-weight:500;color:var(--danger);margin-bottom:4px;">
          あなた <span class="gind" id="ind-bottom"></span>
        </div>
        <div id="h-bottom" class="hand-row"></div>
        <div id="nashi-wrap" style="display:none;margin-top:8px;">
          <button id="nashi-btn" onclick="doPass()" style="font-size:14px;padding:8px 30px;" class="secondary">なし（パス）</button>
        </div>
      </div>
    </div>
    <div class="log-bar">
      <div id="st" style="font-size:13px;font-weight:500;color:var(--text);text-align:center;">待機中</div>
      <div id="log" style="margin-top:4px;max-height:48px;overflow-y:auto;"></div>
    </div>
  </div>

  <div class="info-panel">
    <div class="info-head">接続情報・プレイヤー</div>
    <div id="player-info" class="info-body">—</div>
  </div>
</div><!-- /gw -->

</div><!-- /app -->

<script>
// ===== CONSTANTS =====
const TT=['王','飛','角','金','銀','馬','香','し'];
const TC={'王':2,'飛':2,'角':2,'金':4,'銀':4,'馬':4,'香':4,'し':10};
const KN={'王':'おう','飛':'ひ','角':'かく','金':'きん','銀':'ぎん','馬':'うま','香':'こう','し':'し'};
const PTS={'王':50,'飛':40,'角':40,'金':30,'銀':30,'馬':20,'香':20,'し':10};
const DLY=820; const GOAL=150;
const PEER_PFX='goita-v3-';
const PEER_CFG={host:'0.peerjs.com',port:443,secure:true,path:'/'};

// ===== NETWORK STATE =====
const NET={mode:'init',myPid:0,roomCode:'',peer:null,hostConn:null,conns:{},humanPids:new Set(),names:['P1','P2','P3','P4']};

function genCode(){return Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[0|Math.random()*24]).join('');}
function isHuman(pid){return NET.humanPids.has(pid);}
function PN(pid){return['あなた','右家','上家','左家'][(pid-NET.myPid+4)%4];}
const team=p=>p%2===0?0:1;
function playerLabel(pid){return`${PN(pid)}（${'紅白'.split('')[team(pid)]}組）`;}

// ===== GAME STATE =====
let G={h:[[],[],[],[]],used:[[],[],[],[]],at:null,atr:0,ph:'idle',rq:[],ri:0,responder:0,defTile:null,defOwner:null,ouInPlay:false,sc:[0,0],goshiCpuCont:true,tyData:null,tyActData:null};
let prevAt=null;

// ===== HELPERS =====
function recvOpts(hand,at){
  if(at==='王')return hand.reduce((a,t,i)=>t==='王'?[...a,i]:a,[]);
  if(at==='し'||at==='香')return hand.reduce((a,t,i)=>t===at?[...a,i]:a,[]);
  return hand.reduce((a,t,i)=>(t===at||t==='王')?[...a,i]:a,[]);
}
function canRecv(hand,at){return recvOpts(hand,at).length>0;}
function cpuPickRecv(hand,at){const opts=recvOpts(hand,at);return opts.find(i=>hand[i]!=='王')??opts[0];}
function canOuAtk(hand,isLast){return isLast||G.ouInPlay||hand.filter(t=>t==='王').length>=2;}
function cpuPickAtk(hand){
  if(!hand.length)return 0;
  const isLast=hand.length===1;
  const valid=hand.filter(t=>t!=='王'||canOuAtk(hand,isLast));
  const useH=valid.length?valid:hand;
  const cnt={};useH.forEach(t=>{cnt[t]=(cnt[t]||0)+1;});
  const mx=Math.max(...Object.values(cnt));
  const cands=useH.filter(t=>cnt[t]===mx);
  const t=cands[0|Math.random()*cands.length];
  const idx=hand.indexOf(t);return idx>=0?idx:0;
}
function mkQ(p){return[(p+1)%4,(p+2)%4,(p+3)%4];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkDeck(){return shuffle(TT.flatMap(t=>Array(TC[t]).fill(t)));}

// ===== STATE CHANGE =====
function afterChange(){
  if(NET.mode==='host')broadcastState();
  render();autoCPU();
}
function autoCPU(){
  const ph=G.ph;
  if(ph==='parent_def'&&!isHuman(G.atr)){setTimeout(()=>{if(G.ph==='parent_def')hostDef(G.atr,0|Math.random()*G.h[G.atr].length);},DLY);}
  else if(ph==='parent_atk'&&!isHuman(G.atr)){setTimeout(()=>{if(G.ph==='parent_atk')hostAtk(G.atr,cpuPickAtk(G.h[G.atr]));},DLY);}
  else if(ph==='respond'){hostProcessQ();}
}
function broadcastState(){
  const state=JSON.parse(JSON.stringify({G,humanPids:[...NET.humanPids],names:NET.names}));
  Object.values(NET.conns).forEach(c=>{try{c.send({type:'state',state});}catch(e){}});
}

// ===== GAME LOGIC =====
function hostDef(p,idx){
  if(G.ph!=='parent_def'||G.atr!==p)return;
  const t=G.h[p][idx];G.h[p].splice(idx,1);
  G.used[p].push({t,tp:'def',hidden:true});
  G.defTile=t;G.defOwner=p;G.ph='parent_atk';
  addLog(`${playerLabel(p)}が守り牌を伏せた`);afterChange();
}
function hostAtk(p,idx){
  if(G.ph!=='parent_atk'||G.atr!==p)return;
  const t=G.h[p][idx];
  if(t==='王'&&!canOuAtk(G.h[p],G.h[p].length===1))return;
  G.h[p].splice(idx,1);G.used[p].push({t,tp:'atk'});G.at=t;G.atr=p;
  addLog(`${playerLabel(p)}が「${t}」で攻め！`);
  if(!G.h[p].length){hostEndRound(p);return;}
  G.ph='respond';G.rq=mkQ(p);G.ri=0;afterChange();
}
function hostRecv(p,idx){
  if(G.ph!=='player_recv'||G.responder!==p)return;
  if(!recvOpts(G.h[p],G.at).includes(idx))return;
  const rt=G.h[p][idx];G.h[p].splice(idx,1);G.used[p].push({t:rt,tp:'def'});
  if(rt==='王')G.ouInPlay=true;
  addLog(`${playerLabel(p)}が「${rt}」で${rt==='王'?'切り':'受け'}`);
  G.ph='player_atk';afterChange();
  if(!isHuman(p)){setTimeout(()=>{if(G.ph==='player_atk')hostPAtk(p,cpuPickAtk(G.h[p]));},DLY);}
}
function hostPAtk(p,idx){
  if(G.ph!=='player_atk'||G.responder!==p)return;
  const t=G.h[p][idx];
  if(t==='王'&&!canOuAtk(G.h[p],G.h[p].length===1))return;
  G.h[p].splice(idx,1);G.used[p].push({t,tp:'atk'});G.at=t;G.atr=p;
  addLog(`${playerLabel(p)}が「${t}」で攻め！`);
  if(!G.h[p].length){hostEndRound(p);return;}
  G.ph='respond';G.rq=mkQ(p);G.ri=0;afterChange();
}
function hostPass(p){
  if(G.ph!=='player_recv'||G.responder!==p)return;
  addLog(`${playerLabel(p)}はなし（パス）`);
  G.ri++;G.ph='respond';afterChange();
}
function hostCpuRA(p){
  const ri=cpuPickRecv(G.h[p],G.at);
  const rt=G.h[p][ri];G.h[p].splice(ri,1);G.used[p].push({t:rt,tp:'def'});
  if(rt==='王')G.ouInPlay=true;
  const ai=cpuPickAtk(G.h[p]);
  const at=G.h[p][ai];G.h[p].splice(ai,1);G.used[p].push({t:at,tp:'atk'});
  G.at=at;G.atr=p;
  addLog(`${playerLabel(p)}が「${rt}」で${rt==='王'?'切り':'受け'}、「${at}」で攻め！`);
  if(!G.h[p].length){hostEndRound(p);return;}
  G.ph='respond';G.rq=mkQ(p);G.ri=0;afterChange();
}
function hostProcessQ(){
  if(G.ph!=='respond')return;
  if(G.ri>=G.rq.length){hostAllPass();return;}
  const resp=G.rq[G.ri];
  if(isHuman(resp)){
    G.ph='player_recv';G.responder=resp;afterChange();
    setStatus(`「${G.at}（${KN[G.at]}）」— ${canRecv(G.h[resp],G.at)?G.at+(G.at!=='し'&&G.at!=='香'?'または王':'のみ')+'で受けるかなし':'受けられません。なし（パス）'}を押してください`);
  } else {
    setTimeout(()=>{

function hostCheckTeyaku(){

  for(let p=0;p<4;p++){

      const tw=team(p);G.sc[tw]+=100;G.atr=p;addLog(`${playerLabel(p)}が八し！100点獲得`);
      showTy('八し（はちし）',playerLabel(p),G.h[p].map(t=>({t,hidden:false})),
        `全ての駒が「し」！<strong>${['紅','白'][tw]}組に100点獲得</strong>`,
        [{label:'次の勝負へ',act:'next'}],-1,{name:'round',tw});return;
    }
  }
  for(let p=0;p<4;p++){
    if(shiC[p]===7){
      const tw=team(p);const ns=G.h[p].filter(t=>t!=='し')[0]||'し';
      const pts=(PTS[ns]||10)*2;G.sc[tw]+=pts;G.atr=p;addLog(`${playerLabel(p)}が七し！${pts}点獲得`);
      showTy('七し（ななし）',playerLabel(p),G.h[p].map(t=>({t,hidden:false})),
        `し以外「${ns}」の2倍！<strong>${['紅','白'][tw]}組に${pts}点獲得</strong>`,
        [{label:'次の勝負へ',act:'next'}],-1,{name:'round',tw});return;
    }
  }
  for(let p=0;p<4;p++){
    if(shiC[p]===6){
      const tw=team(p);const ns=G.h[p].filter(t=>t!=='し');
      const same=ns[0]===ns[1];const maxP=Math.max(...ns.map(t=>PTS[t]||0));
      const pts=same?maxP*2:maxP;G.sc[tw]+=pts;G.atr=p;addLog(`${playerLabel(p)}が六し！${pts}点獲得`);
      showTy('六し（ろくし）',playerLabel(p),G.h[p].map(t=>({t,hidden:false})),
        `し以外の高い方の点${same?'（2枚同じで2倍！）':''}<br><strong>${['紅','白'][tw]}組に${pts}点獲得</strong>`,
        [{label:'次の勝負へ',act:'next'}],-1,{name:'round',tw});return;
    }
  }
  const goshi=[0,1,2,3].filter(p=>shiC[p]>=5);
  if(!goshi.length){hostStartSetup();return;}
  if(goshi.includes(0)&&goshi.includes(2)){G.sc[0]+=GOAL;addLog('紅組がペア五し！試合勝利');
    showTy('ペア五し！','あなたと上家（紅組）',G.h[0].filter(t=>t==='し').slice(0,5).map(t=>({t,hidden:false})),
      '紅組の2人がともに五し！<br><strong>紅組が150点獲得・試合勝利！</strong>',
      [{label:'結果へ',act:'end'}],-1,{name:'end',tw:0});return;
  }
  if(goshi.includes(1)&&goshi.includes(3)){G.sc[1]+=GOAL;addLog('白組がペア五し！試合勝利');
    showTy('ペア五し！','右家と左家（白組）',[],
      '白組の2人がともに五し！<br><strong>白組が150点獲得・試合勝利！</strong>',
      [{label:'結果へ',act:'end'}],-1,{name:'end',tw:1});return;
  }
  const p0Has=goshi.includes(0);const enemyG=goshi.filter(p=>team(p)!==0);
  if(p0Has){
    G.goshiCpuCont=!enemyG.length||Math.random()<0.6;
    const note=enemyG.length?`<br>※${playerLabel(enemyG[0])}も五しを宣言。`:'';
    showTy('五し（ごし）','あなた（紅組）',G.h[0].filter(t=>t==='し').slice(0,5).map(t=>({t,hidden:false})),
      `し駒5枚を公開。上家と相談してください。${note}<br>片方が「続ける」なら配り直しなし。`,
      [{label:'このまま続ける',act:'goshi_cont'},{label:'配り直す',act:'goshi_redeal'}],
      0,{name:'goshi'});
  } else {
    const fp=goshi[0];
    showTy('五し（ごし）',playerLabel(fp),G.h[fp].filter(t=>t==='し').slice(0,5).map(t=>({t,hidden:false})),
      `${playerLabel(fp)}が五しを宣言。<br>そのまま勝負を続けます。`,
      [{label:'続行',act:'next'}],-1,{name:'goshi_cpu'});
  }
}
function hostResolveTy(act,pid){
  if(G.ph!=='teyaku')return;
  const waitFor=G.tyData?.waitFor;
  if(waitFor!==-1&&waitFor!==pid)return;
  const{name,...aData}=G.tyActData||{};
  G.ph='idle';G.tyData=null;G.tyActData=null;
  if(NET.mode==='host')broadcastState();

  else if(name==='end'){showEndState(aData.tw);}

  else if(name==='goshi_cpu'){hostStartSetup();}

function pAct(idx){
  const pid=NET.myPid;const ph=G.ph;let action=null;
  if(ph==='parent_def'&&G.atr===pid)action={type:'def',idx};
  else if(ph==='parent_atk'&&G.atr===pid){if(G.h[pid][idx]==='王'&&!canOuAtk(G.h[pid],G.h[pid].length===1))return;action={type:'atk',idx};}
  else if(ph==='player_recv'&&G.responder===pid){if(!recvOpts(G.h[pid],G.at).includes(idx))return;action={type:'recv',idx};}
  else if(ph==='player_atk'&&G.responder===pid){if(G.h[pid][idx]==='王'&&!canOuAtk(G.h[pid],G.h[pid].length===1))return;action={type:'patk',idx};}
  if(action)sendAct(action);
}
function doPass(){if(G.ph!=='player_recv'||G.responder!==NET.myPid)return;sendAct({type:'pass'});}
function doTy(act){sendAct({type:'ty',act});}
function sendAct(action){
  if(NET.mode==='solo'||NET.mode==='host'){hostHandleAction(NET.myPid,action);}
  else{try{NET.hostConn.send({type:'action',action});}catch(e){}}
}
function hostHandleAction(pid,action){
  const{type,idx,act}=action;
  if(type==='def')hostDef(pid,idx);
  else if(type==='atk')hostAtk(pid,idx);
  else if(type==='recv')hostRecv(pid,idx);
  else if(type==='patk')hostPAtk(pid,idx);
  else if(type==='pass')hostPass(pid);
  else if(type==='ty')hostResolveTy(act,pid);
}

function mkT(k,sz,o={}){
  const m={md:[44,50,18,30],sm:[36,42,14,26],xs:[28,34,11,21]}[sz]||[44,50,18,30];
  const[w,h,fs,ty]=m;
  const pts=`${w/2},2 ${(w*.93).toFixed(1)},${(h*.22).toFixed(1)} ${w},${h} 0,${h} ${(w*.07).toFixed(1)},${(h*.22).toFixed(1)}`;
  const cl=['gt',sz,o.cl?'cl':'',o.hl?'hl':'',o.fd?'fd':'',o.atk?'atk':'',o.dimmed?'dimmed':'',o.anim?'landed':''].filter(Boolean).join(' ');

function rotateTile(html,deg,w,h){
  if(deg===0)return html;const abs=((deg%360)+360)%360;const swap=abs===90||abs===270;
  const rw=swap?h:w,rh=swap?w:h;const tx=(rw-w)/2,ty=(rh-h)/2;
  return`<div style="display:inline-block;width:${rw}px;height:${rh}px;position:relative;"><div style="position:absolute;left:${tx}px;top:${ty}px;transform:rotate(${deg}deg);transform-origin:${w/2}px ${h/2}px;">${html}</div></div>`;
}
function mkMicro(t,tp,hidden,isLast,isLive){
  const w=18,h=22;
  const pts=`${w/2},1.5 ${(w*.92).toFixed(1)},${(h*.22).toFixed(1)} ${w},${h} 0,${h} ${(w*.08).toFixed(1)},${(h*.22).toFixed(1)}`;
  let fill,stroke,sw='0.7';
  if(isLive){fill='#d4f0e2';stroke='#2a9d5c';sw='1.5';}
  else if(hidden){fill='var(--bg3)';stroke='var(--border2)';}
  else if(tp==='atk'){fill='#fff3d0';stroke='#d47d00';}
  else{fill='#d0e8f8';stroke='#2b7fd4';}
  const la=isLive?';animation:gpulse 1.2s infinite':'';
  const ea=isLast?'animation:gshow .22s ease-out both'+la:isLive?'animation:gpulse 1.2s infinite':'';
  const sa=ea?`style="${ea}"`:'';
  const tf=isLive?'#2a9d5c':'var(--text)';
  const tx=hidden?'':`<text x="${w/2}" y="14" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="'Noto Serif JP',serif" font-weight="900" fill="${tf}">${t}</text>`;
  return`<svg ${sa} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${pts}" style="fill:${fill};stroke:${stroke};stroke-width:${sw};"/>${tx}</svg>`;
}

  updateLobby();pstatus('');
  NET.peer=new Peer(PEER_PFX+code,PEER_CFG);
  NET.peer.on('error',e=>{if(e.type==='unavailable-id'){NET_create();}else{pstatus('接続エラー: '+e.message);}});
  NET.peer.on('connection',conn=>{
    const pid=Object.keys(NET.conns).length+1;if(pid>3){conn.close();return;}
    NET.conns[pid]=conn;NET.humanPids.add(pid);NET.names[pid]='P'+(pid+1);
    conn.on('open',()=>{conn.send({type:'welcome',pid,roomCode:code,names:NET.names,humanPids:[...NET.humanPids]});updateLobby();});
    conn.on('data',data=>hostHandleClientMsg(pid,data));
    conn.on('close',()=>{delete NET.conns[pid];NET.humanPids.delete(pid);updateLobby();});
  });
}
function NET_join(){
  const code=document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length!==5){pstatus('5文字のコードを入力してください');return;}
  NET.roomCode=code;NET.mode='client';pstatus('接続中…');
  NET.peer=new Peer(PEER_CFG);
  NET.peer.on('open',()=>{
    NET.hostConn=NET.peer.connect(PEER_PFX+code,{reliable:true});
    NET.hostConn.on('open',()=>pstatus('ホストへ接続しました'));
    NET.hostConn.on('data',data=>clientHandleMsg(data));
    NET.hostConn.on('close',()=>{if(document.getElementById('gw').style.display!=='none'){alert('ホストから切断されました');}});
  });
  NET.peer.on('error',e=>pstatus('接続失敗: '+e.message));
}
function NET_solo(){
  NET.mode='solo';NET.myPid=0;NET.roomCode='';NET.humanPids=new Set([0]);NET.names=['あなた','CPU','CPU','CPU'];
  document.getElementById('net-ov').style.display='none';document.getElementById('gw').style.display='block';
  updatePlayerInfo();initGame();
}
function NET_hostStart(){
  if(NET.mode!=='host')return;NET.started=true;
  [1,2,3].forEach(pid=>{if(!NET.humanPids.has(pid))NET.names[pid]='CPU';});
  Object.values(NET.conns).forEach(c=>{try{c.send({type:'start',humanPids:[...NET.humanPids],names:NET.names});}catch(e){}});
  document.getElementById('net-ov').style.display='none';document.getElementById('gw').style.display='block';
  updatePlayerInfo();initGame();
}
function NET_back(){
  if(NET.peer){try{NET.peer.destroy();}catch(e){}}
  NET.peer=null;NET.hostConn=null;NET.conns={};NET.mode='init';
  document.getElementById('lv').style.display='none';document.getElementById('sv').style.display='flex';pstatus('');
}
function hostHandleClientMsg(pid,data){if(data.type==='action'){hostHandleAction(pid,data.action);}}
function clientHandleMsg(data){
  if(data.type==='welcome'){
    NET.myPid=data.pid;NET.humanPids=new Set(data.humanPids);NET.names=data.names||NET.names;
    document.getElementById('codeDisp').textContent=data.roomCode;
    document.getElementById('lv-hint').textContent='ホストがゲームを開始するまでお待ちください';
    document.getElementById('sv').style.display='none';document.getElementById('lv').style.display='flex';
    updateLobby();pstatus('');
  } else if(data.type==='start'){
    NET.humanPids=new Set(data.humanPids);NET.names=data.names||NET.names;
    document.getElementById('net-ov').style.display='none';document.getElementById('gw').style.display='block';
    updatePlayerInfo();render();
  } else if(data.type==='state'){
    G=data.state.G;NET.humanPids=new Set(data.state.humanPids||[0]);if(data.state.names)NET.names=data.state.names;
    render();updatePlayerInfo();
  }
}
render();
</script>
